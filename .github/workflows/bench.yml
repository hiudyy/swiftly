name: Benchmark

# Runs the biggest benchmark (deep: 1M requests + concurrency sweep) on every
# push, so performance regressions surface immediately after each commit.
on:
  push:
  workflow_dispatch:

jobs:
  bench:
    name: bench:deep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run the deep benchmark (1M + concurrency sweep)
        run: npm run bench:deep